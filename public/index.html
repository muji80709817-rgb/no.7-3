<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAN-DO-SEE ARCHIVE (TASK 7)</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card-bg: #121212;
      --border: #262626;
      --border-focus: #525252;
      --text-main: #f5f5f5;
      --text-muted: #a3a3a3;
      --accent: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px;
      line-height: 1.6;
    }

    .banner {
      background: #171717;
      border: 1px solid #333;
      color: #d4d4d4;
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header {
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }
    .header-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    .header-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--border-focus); }

    h2 {
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .target-display {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      background: #171717;
      padding: 18px 24px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
      min-height: 50px;
    }

    .form-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    input, select {
      background: #171717;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      background: #1f1f1f;
    }
    input[type="text"], input[type="email"], input[type="password"] { flex: 1; min-width: 160px; }

    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    
    .btn-secondary { background: #262626; color: var(--text-main); border: 1px solid #333; }
    .btn-danger { background: #261212; color: #f87171; border: 1px solid #451a1a; }

    .hidden { display: none !important; }

    .todo-item {
      background: #171717;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 12px;
    }
    .todo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .todo-title { font-size: 1.05rem; font-weight: 600; }
    .tag {
      background: #262626; color: var(--text-muted); border: 1px solid #333;
      padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600;
    }
    .todo-meta {
      font-size: 0.85rem; color: var(--text-muted); margin-top: 10px; display: flex; gap: 16px;
    }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px;
    }
    .stat-box {
      background: #171717; border: 1px solid var(--border); padding: 18px; border-radius: 8px; text-align: center;
    }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-num { font-size: 1.8rem; font-weight: 800; color: var(--accent); margin-top: 4px; }
  </style>
</head>
<body>

  <!-- 상태 배너 -->
  <div class="banner">
    <span id="bannerText">🔒 AUTHENTICATION REQUIRED: 로그인 후 내 자료를 볼 수 있습니다.</span>
    <button id="logoutBtn" class="btn-danger hidden" onclick="handleLogout()" style="padding: 6px 12px; font-size:0.8rem;">LOGOUT</button>
  </div>

  <header>
    <div class="header-title">SECURITY ROADMAP 2026</div>
    <div class="header-subtitle">Plan-Do-See Executive Performance Dashboard</div>
  </header>

  <!-- [화면 1] 로그인 / 회원가입 UI -->
  <div id="authContainer" class="card">
    <h2 id="authTitle">00 / AUTHENTICATION LOGIN</h2>
    <div class="form-group" style="flex-direction: column;">
      <input type="email" id="authEmail" placeholder="이메일 입력 (예: userA@test.com)" required />
      <input type="password" id="authPassword" placeholder="비밀번호 입력 (마스킹 처리)" required />
      <button id="authSubmitBtn" onclick="handleAuthSubmit()">로그인</button>
      <div id="authError" style="color: #f87171; font-size: 0.85rem; margin-top: 4px;"></div>
    </div>
    <div style="text-align: center; margin-top: 10px;">
      <a href="#" id="toggleAuthMode" onclick="toggleAuthMode(event)" style="color: var(--text-muted); font-size:0.85rem; text-decoration: none;">계정이 없으신가요? 회원가입</a>
    </div>
  </div>

  <!-- [화면 2] 다이어리 메인 화면 (로그인 성공 시 노출) -->
  <div id="mainDashboard" class="hidden">
    
    <!-- 1. PLAN -->
    <div class="card">
      <h2>01 / Master Plan</h2>
      <div class="form-group">
        <input type="text" id="planTitle" placeholder="새로운 마스터 플랜 입력">
        <button onclick="createPlan()">플랜 업데이트</button>
      </div>
      <div id="planList" class="target-display">🎯 정보보안 직무로 취업하기</div>
    </div>

    <!-- 2. DO -->
    <div class="card">
      <h2>02 / Action Items (Do)</h2>
      <div class="form-group">
        <input type="text" id="todoTitle" placeholder="목표 할 일 (예: 리눅스마스터 2급 취득)">
        <input type="date" id="todoDueDate">
        <select id="todoPriority">
          <option value="높음">PRIORITY: HIGH</option>
          <option value="보통" selected>PRIORITY: MID</option>
          <option value="낮음">PRIORITY: LOW</option>
        </select>
        <input type="text" id="todoTag" placeholder="TAG (예: 자격증)">
        <input type="number" id="todoEstTime" placeholder="예상시간(분)" style="width:110px;">
        <button onclick="createTodo()">태스크 추가</button>
      </div>

      <div class="form-group" style="background:#171717; padding:14px; border-radius:8px; border:1px solid var(--border);">
        <input type="text" id="searchKeyword" placeholder="검색어 필터링..." oninput="renderTodos()">
        <select id="filterStatus" onchange="renderTodos()">
          <option value="ALL">ALL STATUS</option>
          <option value="ACTIVE">IN PROGRESS</option>
          <option value="COMPLETED">COMPLETED</option>
        </select>
        <select id="sortCriterion" onchange="renderTodos()">
          <option value="dueDate">SORT BY DUE DATE</option>
          <option value="priority">SORT BY PRIORITY</option>
        </select>
      </div>

      <div id="todoList"></div>
    </div>

    <!-- 3. SEE -->
    <div class="card">
      <h2>03 / Performance Review (See)</h2>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-label">Total Plans</div><div id="statPlanCount" class="stat-num">0</div></div>
        <div class="stat-box"><div class="stat-label">Completed</div><div id="statDoneCount" class="stat-num">0</div></div>
        <div class="stat-box"><div class="stat-label">Delayed</div><div id="statDelayCount" class="stat-num">0</div></div>
        <div class="stat-box"><div class="stat-label">Blocked</div><div id="statBlockCount" class="stat-num">0</div></div>
      </div>
    </div>

  </div>

  <script>
    let isLoginMode = true;
    let todosData = [];

    window.onload = () => {
      const token = localStorage.getItem('token');
      if (token) {
        loadTodos();
      } else {
        showAuthForm();
      }
    };

    function toggleAuthMode(e) {
      e.preventDefault();
      isLoginMode = !isLoginMode;
      document.getElementById('authTitle').innerText = isLoginMode ? '00 / AUTHENTICATION LOGIN' : '00 / REGISTER ACCOUNT';
      document.getElementById('authSubmitBtn').innerText = isLoginMode ? '로그인' : '회원가입';
      document.getElementById('toggleAuthMode').innerText = isLoginMode ? '계정이 없으신가요? 회원가입' : '이미 계정이 있으신가요? 로그인';
      document.getElementById('authError').innerText = '';
    }

    async function handleAuthSubmit() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;

      if (!email || !password) {
        document.getElementById('authError').innerText = '이메일과 비밀번호를 입력하세요.';
        return;
      }

      const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/signup';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          document.getElementById('authError').innerText = data.error || '인증 처리에 실패했습니다.';
          return;
        }

        if (isLoginMode) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user_email', email);
          loadTodos();
        } else {
          alert('회원가입이 정상 완료되었습니다! 로그인해 주세요.');
          toggleAuthMode(new Event('click'));
        }
      } catch (err) {
        document.getElementById('authError').innerText = '서버 통신 실패. 백엔드 배포 상태를 확인하세요.';
      }
    }

    async function loadTodos() {
      const token = localStorage.getItem('token');
      const email = localStorage.getItem('user_email');

      try {
        const res = await fetch('/api/todos', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401 || res.status === 403) {
          handleLogout();
          return;
        }

        const data = await res.json();
        if (Array.isArray(data)) {
          todosData = data;
        }
        showDashboard(email);
      } catch (err) {
        showDashboard(email || 'User');
      }
    }

    function showDashboard(email) {
      document.getElementById('authContainer').classList.add('hidden');
      document.getElementById('mainDashboard').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      document.getElementById('bannerText').innerText = `🔑 AUTHENTICATED USER: ${email} (내 자료만 표시됨)`;
      renderTodos();
    }

    function showAuthForm() {
      document.getElementById('authContainer').classList.remove('hidden');
      document.getElementById('mainDashboard').classList.add('hidden');
      document.getElementById('logoutBtn').classList.add('hidden');
      document.getElementById('bannerText').innerText = '🔒 AUTHENTICATION REQUIRED: 로그인 후 내 자료를 볼 수 있습니다.';
    }

    function handleLogout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user_email');
      showAuthForm();
    }

    function createPlan() {
      const title = document.getElementById('planTitle').value.trim();
      if (!title) return;
      document.getElementById('planList').innerText = `🎯 ${title}`;
      document.getElementById('planTitle').value = '';
    }

    async function createTodo() {
      const title = document.getElementById('todoTitle').value.trim();
      if (!title) {
        alert('할 일(제목)을 입력해주세요!');
        return;
      }

      const token = localStorage.getItem('token');
      
      // Supabase todos 테이블 컬럼(due_date, est_time 등) 및 프론트 호환 호환 구조
      const newTodo = {
        id: Date.now(),
        title: title,
        due_date: document.getElementById('todoDueDate').value || new Date().toISOString().split('T')[0],
        dueDate: document.getElementById('todoDueDate').value || new Date().toISOString().split('T')[0],
        priority: document.getElementById('todoPriority').value || '보통',
        tag: document.getElementById('todoTag').value.trim() || '일반',
        est_time: Number(document.getElementById('todoEstTime').value) || 60,
        estTime: Number(document.getElementById('todoEstTime').value) || 60
      };

      // 1. 화면(UI)에 즉시 반영
      todosData.push(newTodo);
      renderTodos();

      // 2. 입력창 초기화
      document.getElementById('todoTitle').value = '';
      document.getElementById('todoTag').value = '';
      document.getElementById('todoEstTime').value = '';

      // 3. 백엔드 및 Supabase DB 저장 요청
      try {
        await fetch('/api/todos', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(newTodo)
        });
      } catch (e) {
        console.warn('서버 저장 통신 오류:', e);
      }
    }

    function renderTodos() {
      const keyword = (document.getElementById('searchKeyword').value || '').toLowerCase();
      let filtered = (todosData || []).filter(t => t.title && t.title.toLowerCase().includes(keyword));

      const list = document.getElementById('todoList');
      if (filtered.length === 0) {
        list.innerHTML = `<div style="color:var(--text-muted); padding:20px; text-align:center;">등록된 태스크가 없습니다.</div>`;
      } else {
        list.innerHTML = filtered.map(t => `
          <div class="todo-item">
            <div class="todo-header">
              <span class="todo-title">${t.title}</span>
              <button onclick="deleteTodo(${t.id})" class="btn-danger">DEL</button>
            </div>
            <div class="todo-meta">
              <span>DUE: ${t.due_date || t.dueDate || '미정'}</span>
              <span>PRIORITY: ${t.priority || '보통'}</span>
              <span class="tag">${t.tag || '일반'}</span>
              <span>EST: ${t.est_time || t.estTime || 60}m</span>
            </div>
          </div>
        `).join('');
      }

      document.getElementById('statPlanCount').innerText = todosData.length;
    }

    async function deleteTodo(id) {
      todosData = todosData.filter(t => t.id !== id);
      renderTodos();

      const token = localStorage.getItem('token');
      try {
        await fetch(`/api/todos/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
      } catch (e) {
        console.warn('서버 삭제 요청 실패:', e);
      }
    }
  </script>
</body>
</html>
